<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بررسی نمایش · محیط تست مدرسه</title><style>
*{box-sizing:border-box}body{margin:0;background:#e2e8f0;color:#0f172a;font:15px Tahoma,sans-serif}header{padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #cbd5e1}h1{font-size:18px;margin:0}label{display:flex;gap:8px;align-items:center}select,a{padding:10px;border:1px solid #94a3b8;border-radius:8px;min-height:44px;background:#fff;color:#075985}p{padding:0 14px;line-height:1.9}main{max-width:100%;overflow:auto;padding:12px;direction:ltr}iframe{display:block;margin:0 auto;border:1px solid #94a3b8;background:white;border-radius:8px;height:1000px;width:390px;max-width:none}#measure{font-weight:bold}
</style></head><body><header><h1>بررسی نمایش واقعی محیط تست</h1><label>عرض قاب<select id="width" aria-label="عرض قاب نمایش"><option value="320">۳۲۰ · گوشی کوچک</option><option value="390" selected>۳۹۰ · گوشی</option><option value="820">۸۲۰ · تبلت</option><option value="1440">۱۴۴۰ · رایانه</option></select></label><a href="./index.html">بازگشت به محیط تست کامل</a><span id="measure" role="status">عرض قاب: ۳۹۰ پیکسل</span></header><p>این قاب همان برنامه و دادهٔ آزمایشی مرورگر شماست. برای آزمایش ظاهر، اندازه و نقش‌ها از کنترل‌های داخل قاب استفاده کنید. قاب بزرگ‌تر از صفحه، در این نما به‌صورت افقی پیمایش می‌شود.</p><main><iframe id="app" title="محیط تست مدرسه در قاب انتخاب‌شده" src="./index.html?framed=1"></iframe></main><script>
const select=document.getElementById('width'),frame=document.getElementById('app'),measure=document.getElementById('measure');select.addEventListener('change',()=>{frame.style.width=select.value+'px';measure.textContent='عرض قاب: '+Number(select.value).toLocaleString('fa-IR')+' پیکسل';});
</script></body></html>
